name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: win64
          cos: "x64"
        - os: arm64
          cos: "ARM64"
    runs-on: windows-latest
    steps:
    - name: Resolve latest dependency versions
      run: |
        function Get-LatestTag($repo) {
          $headers = @{
            "Accept" = "application/vnd.github+json"
            "User-Agent" = "github-actions"
          }
          $resp = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest" -Headers $headers
          if (-not $resp.tag_name) {
            throw "No latest release found for $repo"
          }
          return $resp.tag_name.TrimStart('v')
        }
        $ver1 = Get-LatestTag "zlib-ng/zlib-ng"
        $ver2 = Get-LatestTag "libjpeg-turbo/libjpeg-turbo"
        $ver3 = Get-LatestTag "danoli3/FreeImage"
        "ZLIBNG_VER=$ver1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "JPEGTURBO_VER=$ver2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "FREEIMAGE_VER=$ver3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - uses: actions/checkout@v6
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.os }}
    - name: Compile
      env:
        CL: /nologo /MP /GL
        LINK: /LTCG
      run: |
        $ErrorActionPreference = "Stop"
        $env:CMAKE_BUILD_PARALLEL_LEVEL = [Environment]::ProcessorCount
        Write-Host "CL=$env:CL"
        Write-Host "LINK=$env:LINK"
        Write-Host "CMAKE_BUILD_PARALLEL_LEVEL=$env:CMAKE_BUILD_PARALLEL_LEVEL"
        md build
        cd build
        cmake .. -G "Visual Studio 18 2026" -A ${{ matrix.cos }}
        cmake --build . --config Release --parallel $env:CMAKE_BUILD_PARALLEL_LEVEL --verbose
        move Release\*.dll .
        move bin\*.dll .
        7z a ..\${{ matrix.os }}.7z *.dll
        7z a ..\${{ matrix.os }}-dev.7z include\FreeImage.h lib\FreeImage.lib
    - name: Upload
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ matrix.os }}*.7z
        tag: ${{ env.FREEIMAGE_VER }}
        overwrite: true
        file_glob: true
