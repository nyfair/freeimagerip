name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: win64
          cos: "x64"
        - os: arm64
          cos: "ARM64"
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.os }}
    - name: Compile
      run: |
        md build
        cd build
        cmake .. -G "Visual Studio 18 2026" -A ${{ matrix.cos }}
        cmake --build . --config Release
        move Release\*.dll .
        move bin\*.dll .
        7z a ..\${{ matrix.os }}.7z *.dll
        7z a ..\${{ matrix.os }}-dev.7z include\FreeImage.h lib\FreeImage.lib
    - name: Upload
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ matrix.os }}*.7z
        tag: 3.19.28
        overwrite: true
        file_glob: true
